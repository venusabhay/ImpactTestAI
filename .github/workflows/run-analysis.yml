name: Run Analysis (Pilot)

# Runs the vertical-slice analyzer against ANOTHER team's repository and
# change, on demand, via manual inputs -- no command line, no local setup,
# no need to understand design8/design9.
#
# HARD CONSTRAINTS (do not remove or work around these):
#   - The target repository is checked out READ-ONLY. This workflow never
#     commits, pushes, merges, or otherwise writes to it.
#   - This workflow executes the target repository's own install/test
#     scripts (npm install / npm test) to run the validation the analyzer
#     selects. Only run this against repositories your organization
#     already trusts to run in CI -- exactly the same trust you already
#     extend to that repository's own pipeline.
#   - No credentials are stored in this repository or this file. Private
#     target repositories require a repository secret named
#     TARGET_REPO_TOKEN (see slice/PILOT.md for the exact scopes needed).
#     Public repositories need no token at all.
#   - This does not require or use any WRITE permission anywhere. Artifact
#     History (report.md/audit.json/metadata.json, each run uniquely
#     identified by run_id) is preserved via actions/upload-artifact --
#     GitHub's own artifact storage for this workflow run -- never by
#     committing or pushing to any repository. `permissions: contents: read`
#     below is unchanged from before that milestone.
#   - `validation_timeout_seconds` (optional input, default 180, capped at
#     MAX_VALIDATION_TIMEOUT_SECONDS below) only changes how long the
#     analyzer waits for the target repository's own validation command to
#     finish before reporting INCONCLUSIVE -- it never changes what counts
#     as a pass, a fail, or how risk is assessed (see
#     slice/VALIDATION_TIMEOUT_PROPOSAL.md /
#     slice/VALIDATION_TIMEOUT_DISPOSITION.md). This is a general pilot
#     capability for any repository whose legitimate validation is slower
#     than the default, not a setting tied to any specific repository.

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: "Target repository, as owner/repo (e.g. team-a/payment-service)"
        required: true
        type: string
      target_ref:
        description: "The change to analyze: a branch name, or a PR ref (refs/pull/123/head)"
        required: true
        type: string
      base_ref:
        description: "Branch to diff against (what target_ref is being proposed on top of)"
        required: false
        type: string
        default: "main"
      validation_timeout_seconds:
        description: >-
          Seconds to allow the target repository's validation command to run
          before it's reported INCONCLUSIVE (which always results in
          ESCALATE). Most repositories are fine with the default. Raise this
          only if a repository's own legitimate test/build suite genuinely
          needs more time -- it does not change what counts as a pass, a
          fail, or how risk is assessed, only how long the analyzer waits
          for a real result. Capped at 1800 (30 minutes); see
          MAX_VALIDATION_TIMEOUT_SECONDS below.
        required: false
        type: string
        default: "180"

permissions:
  contents: read

env:
  # Explicit ceiling for validation_timeout_seconds, enforced by the
  # "Validate timeout input" step below. Sized so the job-level
  # timeout-minutes (also below) can comfortably exceed it with room for
  # checkout/setup/artifact-upload overhead, while staying well short of
  # GitHub's own implicit 360-minute job default -- an explicit, bounded
  # maximum, not an unlimited execution window.
  MAX_VALIDATION_TIMEOUT_SECONDS: 1800

jobs:
  analyze:
    runs-on: ubuntu-latest
    # Must genuinely exceed, not just equal, the worst case this workflow
    # permits: up to 5 minutes for `npm install` (analyze_change.py's own
    # separate, fixed timeout for that step) + up to 30 minutes for the
    # validation command itself (MAX_VALIDATION_TIMEOUT_SECONDS) = a
    # 35-minute hard floor. 60 minutes leaves a real 25-minute margin for
    # checkout/setup/artifact-upload, not a knife-edge one -- the point of
    # this setting is to make sure GitHub's own job timeout can never kill
    # the job before the analyzer's own, shorter, internal timeout has a
    # chance to fire and report INCONCLUSIVE honestly. Without an explicit
    # value here, GitHub's implicit 360-minute default would apply --
    # technically enough headroom today, but not an explicit, reviewed
    # bound, which is what's required.
    timeout-minutes: 60
    steps:
      - name: Checkout ImpactTestAI (the analyzer)
        uses: actions/checkout@v4

      - name: Validate timeout input
        # Fails fast, before even checking out the target repository, if
        # the input is non-numeric or exceeds the explicit cap -- omitting
        # the input entirely leaves it at the declared default ("180"),
        # reproducing exactly today's behavior.
        run: |
          VALUE="${{ inputs.validation_timeout_seconds }}"
          if ! [[ "$VALUE" =~ ^[0-9]+$ ]]; then
            echo "::error::validation_timeout_seconds must be a positive integer number of seconds, got '$VALUE'"
            exit 1
          fi
          if [ "$VALUE" -gt "$MAX_VALIDATION_TIMEOUT_SECONDS" ]; then
            echo "::error::validation_timeout_seconds ($VALUE) exceeds the maximum of $MAX_VALIDATION_TIMEOUT_SECONDS seconds"
            exit 1
          fi
          echo "VALIDATION_TIMEOUT_SECONDS=$VALUE" >> "$GITHUB_ENV"

      - name: Checkout target repository (read-only)
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.target_repo }}
          ref: ${{ inputs.target_ref }}
          token: ${{ secrets.TARGET_REPO_TOKEN || github.token }}
          path: target-repo
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch base ref for diffing
        working-directory: target-repo
        run: git fetch origin "${{ inputs.base_ref }}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run analysis
        run: |
          mkdir -p slice/reports
          SAFE_NAME=$(echo "${{ inputs.target_repo }}" | tr '/' '-')
          python3 slice/analyze_change.py "$GITHUB_WORKSPACE/target-repo" \
            --against "origin/${{ inputs.base_ref }}" \
            --github-repo "${{ inputs.target_repo }}" \
            --npm-install \
            --validation-timeout-seconds "$VALIDATION_TIMEOUT_SECONDS" \
            --artifacts-root "slice/artifacts" \
            --out "slice/reports/pilot-${SAFE_NAME}-report.md"
          echo "REPORT_STEM=pilot-${SAFE_NAME}-report" >> "$GITHUB_ENV"

      - name: Verify expected artifacts were produced
        # Every execution preserves report.md/audit.json/metadata.json
        # together under slice/artifacts/<organization>/<repository>/<run_id>/
        # (Artifact History milestone) -- this is now the durable historical
        # record; --out above remains for direct/ad-hoc use only. Locates
        # the run this job just produced by finding the single run
        # directory under this target repo's path (workflow_dispatch runs
        # one analysis per job, so exactly one is expected here).
        run: |
          RUN_DIR=$(find slice/artifacts -mindepth 3 -maxdepth 3 -type d | head -1)
          test -n "$RUN_DIR"
          test -s "$RUN_DIR/report.md"
          test -s "$RUN_DIR/audit.json"
          test -s "$RUN_DIR/metadata.json"
          python3 -c "import json; json.load(open('$RUN_DIR/audit.json'))"
          python3 -c "import json; json.load(open('$RUN_DIR/metadata.json'))"
          RUN_ID=$(python3 -c "import json; print(json.load(open('$RUN_DIR/metadata.json'))['run_id'])")
          echo "RUN_DIR=$RUN_DIR" >> "$GITHUB_ENV"
          echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"

      - name: Publish report summary
        if: always()
        run: |
          echo "**Run ID:** \`${RUN_ID}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          cat "${RUN_DIR}/report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload this run's artifacts (report, audit, metadata)
        # Named with the run_id so it can never collide with, or be
        # confused for, any other execution's artifacts -- including a
        # prior or later run against the exact same repository/commit.
        # Nothing here is committed or pushed back to any repository;
        # this only uploads to GitHub Actions' own artifact storage for
        # this workflow run.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-${{ env.RUN_ID }}
          path: ${{ env.RUN_DIR }}
          retention-days: 90
